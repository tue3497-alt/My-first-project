  <!-- A framed teaching board, kept intentionally spare. -->
  <g transform="matrix(1 .418 0 1 660 108)">
    <rect x="2" y="5" width="323" height="158" rx="3" fill="#9A9582" opacity="0.13"/>
    <rect width="323" height="158" rx="2" fill="#C8B18E"/>
    <rect x="6" y="6" width="311" height="146" rx="1" fill="#879F91"/>
    <text x="161.5" y="52" text-anchor="middle" fill="#F8F7F0" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="0.2">Oxygen English</text>
    <path d="M134 67H189" stroke="#D5E0D4" stroke-width="1"/>
    <text x="161.5" y="92" text-anchor="middle" fill="#EFF3EC" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="0.2">A little English. A bigger world.</text>
    <text x="161.5" y="121" text-anchor="middle" fill="#DDE8DC" font-family="Arial, Helvetica, sans-serif" font-size="8.5" letter-spacing="2">A PLACE TO BEGIN</text>
    <path d="M-3 157H326V163H-3Z" fill="#BA9F7A"/>
    <rect x="249" y="153" width="25" height="4" rx="1" fill="#F2EEDF"/>
    <rect x="284" y="152" width="16" height="5" rx="1" fill="#626D63"/>
  </g>

  <!-- Small details: a wall clock, a reading shelf, and living plants. -->
  <g transform="matrix(1 .418 0 1 1016 282)">
