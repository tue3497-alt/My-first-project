<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Oxygen English classroom</title>
  <desc id="desc">A quiet, sunlit classroom with warm oak desks, tall windows, plants, books and a sage green Oxygen English teaching board.</desc>
  <defs>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0.85" y2="1">
      <stop stop-color="#EAF0EC"/><stop offset="1" stop-color="#F9F8F0"/>
    </linearGradient>
    <linearGradient id="sunlight" x1="0" y1="0" x2="1" y2="0.6">
      <stop stop-color="#FFFDF5" stop-opacity="0.8"/><stop offset="1" stop-color="#FFFDF5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D9C29E"/><stop offset="1" stop-color="#C4AB83"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-70%" width="180%" height="240%">
